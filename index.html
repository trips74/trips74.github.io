<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הטיולים שלי</title>
<style>
  :root{--ink:#1F2E2E;--paper:#F4F7F2;--olive-dk:#0F3D3E;--clay:#C1622D;--line:#D7E0DB;--muted:#6C8481;--ok:#2E7D4F;--danger:#B23B2E;}
  *{box-sizing:border-box}
  body{margin:0;font-family:Heebo,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
  header{background:var(--olive-dk);color:var(--paper);padding:20px}
  header h1{margin:0;font-size:24px}
  main{padding:16px;max-width:560px;margin:auto}
  button{font:inherit;border:0;border-radius:10px;padding:12px 16px;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .primary{background:var(--clay);color:#fff;width:100%}
  .ghost{background:transparent;color:var(--paper);border:1px solid rgba(244,247,242,.5)}
  .secondary{background:var(--line);color:var(--ink)}
  .selected{background:var(--olive-dk);color:#fff}
  .danger{background:var(--danger);color:#fff;width:100%}
  .ok{background:var(--ok);color:#fff;width:100%}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
  .card.clickable{cursor:pointer}
  .card small{color:var(--muted)}
  label{display:block;font-size:14px;margin-top:8px}
  input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;margin:6px 0 4px;background:#fff}
  input:disabled{background:var(--paper)}
  .hidden{display:none !important}
  .empty{color:var(--muted);text-align:center;padding:24px}
  .row{display:flex;gap:8px;margin-top:12px}
  .row > *{flex:1}
  #userBar{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
  .badge{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--line);color:var(--ink)}
  .badge.ok{background:var(--ok);color:#fff;width:auto}
  .back{background:transparent;color:var(--clay);padding:6px 0;margin-bottom:8px}
  .section{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
  .note{color:var(--muted);font-size:13px;margin:6px 0}
  .tpl{display:block;width:100%;text-align:start;background:#fff;color:var(--ink);border:1px solid var(--line);margin:6px 0}
</style>
</head>
<body>
<header>
  <h1>הטיולים שלי</h1>
  <div id="userBar" class="hidden">
    <span id="userName"></span>
    <button class="ghost" id="signOutBtn">התנתק</button>
  </div>
</header>

<main>
  <p id="status" class="hidden" style="color:var(--danger);text-align:center"></p>

  <section id="loginView" class="hidden" style="text-align:center;padding-top:40px">
    <p>כדי ליצור ולנהל טיולים, התחבר עם חשבון Google.</p>
    <div id="gsiButton" style="display:flex;justify-content:center;margin:12px 0"></div>
    <p style="color:var(--muted);font-size:13px">אם נפתחת מתוך וואטסאפ, פתח את הקישור בספארי או בכרום.</p>
  </section>

  <!-- LIST VIEW -->
  <section id="listView" class="hidden">
    <button class="primary" id="newTripBtn">טיול חדש</button>

    <form id="newTripForm" class="card hidden">
      <div class="row">
        <button type="button" class="secondary" id="srcBlank">מאפס</button>
        <button type="button" class="secondary" id="srcTpl">מתבנית</button>
      </div>

      <div id="tplBox" class="hidden section">
        <input id="tplSearch" placeholder="חיפוש תבנית לפי שם או אזור">
        <div id="tplList"></div>
        <p class="note" id="tplSummary"></p>
        <p class="note">חיפוש ברשת יתווסף בשלב הבא, דרך שרת מתווך.</p>
      </div>

      <label>שם הטיול<input id="tripTitle" required maxlength="80"></label>
      <label>תאריך התחלה<input id="startDate" type="date" required></label>
      <label>תאריך סיום<input id="endDate" type="date" required></label>
      <div class="row">
        <button class="primary" type="submit">צור טיול</button>
        <button type="button" class="secondary" id="cancelBtn">ביטול</button>
      </div>
    </form>

    <div id="tripList"></div>
  </section>

  <!-- TRIP DETAIL VIEW -->
  <section id="tripView" class="hidden">
    <button class="back" id="backBtn">← חזרה לרשימה</button>

    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <h2 id="detailTitle" style="margin:0;font-size:22px"></h2>
      <span id="detailBadge" class="badge">טיוטה</span>
    </div>
    <p id="ownerNote" class="note hidden"></p>

    <form id="tripForm" class="section">
      <label>שם הטיול<input id="dTitle" required maxlength="80"></label>
      <label>תאריך התחלה<input id="dStart" type="date" required></label>
      <label>תאריך סיום<input id="dEnd" type="date" required></label>
      <label>שעת יציאה<input id="dTime" type="time" value="08:00"></label>
      <label>מיקום (לתחזית מזג אוויר)<input id="dLocation" maxlength="80" placeholder="למשל: צפת"></label>
      <div class="row">
        <button class="primary" type="submit" id="saveBtn">שמור שינויים</button>
      </div>
    </form>

    <div id="daysSection" class="section hidden">
      <h3 style="margin:0 0 6px">מסלול</h3>
      <div id="daysList"></div>
      <p class="note" id="gearNote"></p>
    </div>

    <div class="section">
      <button class="ok" id="confirmBtn">אשר את הטיול</button>
      <p class="note" id="confirmNote"></p>
    </div>

    <div class="section">
      <button class="danger" id="deleteBtn">מחק טיול</button>
      <p class="note">מחיקה היא סופית, ורק הבעלים יכול למחוק.</p>
    </div>
    <p id="detailStatus" class="note" style="text-align:center"></p>
  </section>
</main>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithCredential, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
  import {
    getFirestore, collection, addDoc, query, where, onSnapshot, serverTimestamp,
    doc, updateDoc, deleteDoc, getDocs
  } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

  const GOOGLE_WEB_CLIENT_ID = "494703540488-6doup5uslfs4f6q5o332nntp6gt9ef1v.apps.googleusercontent.com";

  const firebaseConfig = {
    apiKey: "AIzaSyAPnZhIgAHf1InAmCwcucU1-YBuxukporg",
    authDomain: "trips74-app.firebaseapp.com",
    projectId: "trips74-app",
    storageBucket: "trips74-app.firebasestorage.app",
    messagingSenderId: "494703540488",
    appId: "1:494703540488:web:81c6ae2ffb4c762071d4bd"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const $ = id => document.getElementById(id);
  let unsubscribeTrips = null;
  let trips = [];
  let templates = [];
  let currentTripId = null;
  let currentUser = null;
  let createMode = 'blank';
  let selectedTplId = null;

  // ---------- Helpers ----------
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  // Adds days to a yyyy-mm-dd string using local calendar math (avoids timezone shifts)
  function addDays(dateStr, n) {
    const [y, m, d] = dateStr.split('-').map(Number);
    const dt = new Date(y, m - 1, d + n);
    return dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate());
  }

  function showStatus(msg) {
    const s = $('status');
    s.textContent = msg;
    s.classList.remove('hidden');
  }
  function clearStatus() { $('status').classList.add('hidden'); }

  function showView(name) {
    $('listView').classList.toggle('hidden', name !== 'list');
    $('tripView').classList.toggle('hidden', name !== 'trip');
  }

  // ---------- Login (Google Identity Services) ----------
  async function handleCredential(response) {
    clearStatus();
    try {
      const credential = GoogleAuthProvider.credential(response.credential);
      await signInWithCredential(auth, credential);
    } catch (err) {
      showStatus('ההתחברות נכשלה: ' + err.code);
    }
  }

  function initGoogleButton() {
    if (!window.google || !window.google.accounts) {
      setTimeout(initGoogleButton, 200);
      return;
    }
    google.accounts.id.initialize({ client_id: GOOGLE_WEB_CLIENT_ID, callback: handleCredential });
    google.accounts.id.renderButton($('gsiButton'), {
      theme: 'outline', size: 'large', text: 'signin_with', locale: 'he'
    });
  }
  initGoogleButton();

  $('signOutBtn').addEventListener('click', () => signOut(auth));

  onAuthStateChanged(auth, user => {
    clearStatus();
    currentUser = user;
    if (user) {
      $('loginView').classList.add('hidden');
      $('userBar').classList.remove('hidden');
      $('userName').textContent = user.displayName || user.email;
      showView('list');
      loadTrips(user.uid);
    } else {
      $('userBar').classList.add('hidden');
      $('listView').classList.add('hidden');
      $('tripView').classList.add('hidden');
      $('loginView').classList.remove('hidden');
      currentTripId = null;
      if (unsubscribeTrips) { unsubscribeTrips(); unsubscribeTrips = null; }
    }
  });

  // ---------- Trips list ----------
  function loadTrips(uid) {
    if (unsubscribeTrips) unsubscribeTrips();
    const q = query(collection(db, 'trips'), where('memberUids', 'array-contains', uid));
    unsubscribeTrips = onSnapshot(q, snap => {
      trips = snap.docs.map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => (a.startDate || '').localeCompare(b.startDate || ''));
      renderTrips();
      if (currentTripId) renderTripDetail();
    }, err => {
      trips = [];
      renderTrips();
      showStatus('שגיאה בטעינת הטיולים: ' + err.code);
    });
  }

  function renderTrips() {
    const list = $('tripList');
    list.innerHTML = '';
    if (!trips.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'עדיין אין טיולים. צור את הראשון!';
      list.appendChild(empty);
      return;
    }
    for (const t of trips) {
      const card = document.createElement('div');
      card.className = 'card clickable';
      const title = document.createElement('strong');
      title.textContent = t.title;
      const badge = document.createElement('span');
      badge.className = 'badge' + (t.status === 'confirmed' ? ' ok' : '');
      badge.style.marginInlineStart = '8px';
      badge.textContent = t.status === 'confirmed' ? 'מאושר' : 'טיוטה';
      const dates = document.createElement('small');
      dates.textContent = `${t.startDate} — ${t.endDate}`;
      card.append(title, badge, document.createElement('br'), dates);
      card.addEventListener('click', () => openTrip(t.id));
      list.appendChild(card);
    }
  }

  // ---------- Create trip: blank or from template ----------
  function resetCreateForm() {
    createMode = 'blank';
    selectedTplId = null;
    $('tripTitle').value = '';
    $('startDate').value = '';
    $('endDate').value = '';
    $('tplSearch').value = '';
    $('tplBox').classList.add('hidden');
    $('tplSummary').textContent = '';
    $('newTripForm').classList.add('hidden');
    highlightSource();
  }

  function highlightSource() {
    $('srcBlank').classList.toggle('selected', createMode === 'blank');
    $('srcTpl').classList.toggle('selected', createMode === 'template');
  }

  async function loadTemplates() {
    try {
      const q = query(collection(db, 'templates'), where('published', '==', true));
      const snap = await getDocs(q);
      templates = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderTemplates();
    } catch (err) {
      templates = [];
      renderTemplates();
      $('tplSummary').textContent = 'לא ניתן לטעון תבניות: ' + err.code;
    }
  }

  function renderTemplates() {
    const term = $('tplSearch').value.trim().toLowerCase();
    const list = $('tplList');
    list.innerHTML = '';
    const matches = templates.filter(t =>
      !term || (t.title || '').toLowerCase().includes(term) || (t.region || '').toLowerCase().includes(term)
    );
    if (!matches.length) {
      const empty = document.createElement('div');
      empty.className = 'note';
      empty.textContent = templates.length ? 'אין תבנית שתואמת את החיפוש.' : 'אין עדיין תבניות מאושרות.';
      list.appendChild(empty);
      return;
    }
    for (const t of matches) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tpl' + (t.id === selectedTplId ? ' selected' : '');
      const days = (t.days || []).length;
      btn.textContent = `${t.title} · ${t.region || ''} · ${days} ימים`;
      btn.addEventListener('click', () => selectTemplate(t.id));
      list.appendChild(btn);
    }
  }

  function selectTemplate(id) {
    selectedTplId = id;
    const t = templates.find(x => x.id === id);
    if (!t) return;
    if (!$('tripTitle').value.trim()) $('tripTitle').value = t.title || '';
    const totalKm = (t.days || []).reduce((s, d) => s + (Number(d.distanceKm) || 0), 0);
    $('tplSummary').textContent =
      `${(t.days || []).length} ימים · ${totalKm.toFixed(1)} ק״מ · ${t.region || ''}`;
    if ($('startDate').value && (t.days || []).length) {
      $('endDate').value = addDays($('startDate').value, t.days.length - 1);
    }
    renderTemplates();
  }

  $('newTripBtn').addEventListener('click', () => {
    $('newTripForm').classList.remove('hidden');
    highlightSource();
  });

  $('srcBlank').addEventListener('click', () => {
    createMode = 'blank';
    selectedTplId = null;
    $('tplBox').classList.add('hidden');
    $('tplSummary').textContent = '';
    highlightSource();
  });

  $('srcTpl').addEventListener('click', () => {
    createMode = 'template';
    $('tplBox').classList.remove('hidden');
    highlightSource();
    loadTemplates();
  });

  $('tplSearch').addEventListener('input', renderTemplates);

  $('startDate').addEventListener('change', () => {
    const t = templates.find(x => x.id === selectedTplId);
    if (t && $('startDate').value && (t.days || []).length) {
      $('endDate').value = addDays($('startDate').value, t.days.length - 1);
    }
  });

  $('cancelBtn').addEventListener('click', resetCreateForm);

  $('newTripForm').addEventListener('submit', async e => {
    e.preventDefault();
    if (!currentUser) return;
    const startDate = $('startDate').value;
    const endDate = $('endDate').value;
    if (endDate < startDate) { alert('תאריך הסיום חייב להיות אחרי תאריך ההתחלה'); return; }

    const tpl = createMode === 'template' ? templates.find(x => x.id === selectedTplId) : null;
    if (createMode === 'template' && !tpl) { alert('בחר תבנית מהרשימה, או עבור ל"מאפס"'); return; }

    // Copy the template structure into the trip. Dates are recalculated from the chosen start date.
    const days = tpl ? (tpl.days || []).map((d, i) => ({
      n: d.n ?? i + 1,
      from: d.from || '',
      to: d.to || '',
      distanceKm: Number(d.distanceKm) || 0,
      ascentM: Number(d.ascentM) || 0,
      descentM: Number(d.descentM) || 0,
      story: d.story || '',
      date: addDays(startDate, i)
    })) : [];

    const gear = tpl ? (tpl.gear || []).map(g => ({
      title: g.title || '',
      items: (g.items || []).map(item => ({ label: item, checked: false }))
    })) : [];

    try {
      await addDoc(collection(db, 'trips'), {
        title: $('tripTitle').value.trim(),
        startDate,
        endDate,
        departureTime: '08:00',
        location: tpl ? (tpl.region || '') : '',
        status: 'draft',
        origin: tpl ? 'template' : 'manual',
        originRef: tpl ? tpl.id : null,
        days,
        gear,
        ownerUid: currentUser.uid,
        memberUids: [currentUser.uid],
        createdAt: serverTimestamp()
      });
      resetCreateForm();
    } catch (err) {
      alert('שמירת הטיול נכשלה: ' + err.code);
    }
  });

  // ---------- Trip details ----------
  function openTrip(id) {
    currentTripId = id;
    const t = trips.find(x => x.id === id);
    if (!t) return;
    $('dTitle').value = t.title || '';
    $('dStart').value = t.startDate || '';
    $('dEnd').value = t.endDate || '';
    $('dTime').value = t.departureTime || '08:00';
    $('dLocation').value = t.location || '';
    $('detailStatus').textContent = '';
    showView('trip');
    renderTripDetail();
  }

  function renderTripDetail() {
    const t = trips.find(x => x.id === currentTripId);
    if (!t) { currentTripId = null; showView('list'); return; }

    const isOwner = currentUser && t.ownerUid === currentUser.uid;
    const confirmed = t.status === 'confirmed';

    $('detailTitle').textContent = t.title;
    $('detailBadge').textContent = confirmed ? 'מאושר' : 'טיוטה';
    $('detailBadge').className = 'badge' + (confirmed ? ' ok' : '');

    const note = $('ownerNote');
    note.classList.toggle('hidden', isOwner);
    note.textContent = 'אתה חבר בטיול הזה. רק הבעלים יכול לערוך אותו.';

    for (const id of ['dTitle', 'dStart', 'dEnd', 'dTime', 'dLocation']) $(id).disabled = !isOwner;
    $('saveBtn').classList.toggle('hidden', !isOwner);
    $('confirmBtn').classList.toggle('hidden', !isOwner);
    $('deleteBtn').closest('.section').classList.toggle('hidden', !isOwner);

    $('confirmBtn').textContent = confirmed ? 'בטל אישור' : 'אשר את הטיול';
    $('confirmBtn').className = confirmed ? 'secondary' : 'ok';
    $('confirmBtn').style.width = '100%';
    $('confirmNote').textContent = confirmed
      ? 'הטיול מאושר. ביטול האישור יחזיר אותו לטיוטה.'
      : 'אישור מסמן שהתוכנית סופית. אפשר לבטל בכל רגע.';

    renderDays(t);
  }

  function renderDays(t) {
    const section = $('daysSection');
    const list = $('daysList');
    list.innerHTML = '';
    const days = t.days || [];
    section.classList.toggle('hidden', !days.length && !(t.gear || []).length);
    if (!days.length) {
      $('gearNote').textContent = (t.gear || []).length
        ? `נוספו ${t.gear.length} קטגוריות ציוד מהתבנית.` : '';
      return;
    }
    for (const d of days) {
      const card = document.createElement('div');
      card.className = 'card';
      const title = document.createElement('strong');
      title.textContent = `יום ${d.n}: ${d.from} ← ${d.to}`;
      const meta = document.createElement('small');
      meta.textContent = `${d.date} · ${d.distanceKm} ק״מ · עלייה ${d.ascentM} מ׳ · ירידה ${d.descentM} מ׳`;
      card.append(title, document.createElement('br'), meta);
      if (d.story) {
        const story = document.createElement('p');
        story.className = 'note';
        story.textContent = d.story;
        card.appendChild(story);
      }
      list.appendChild(card);
    }
    $('gearNote').textContent = (t.gear || []).length
      ? `נוספו ${t.gear.length} קטגוריות ציוד מהתבנית.` : '';
  }

  $('backBtn').addEventListener('click', () => {
    currentTripId = null;
    showView('list');
  });

  $('tripForm').addEventListener('submit', async e => {
    e.preventDefault();
    const t = trips.find(x => x.id === currentTripId);
    if (!t || !currentUser || t.ownerUid !== currentUser.uid) return;
    const startDate = $('dStart').value;
    const endDate = $('dEnd').value;
    if (endDate < startDate) { alert('תאריך הסיום חייב להיות אחרי תאריך ההתחלה'); return; }

    // If the start date moved, keep the day dates in sync with it.
    const days = (t.days || []).map((d, i) => ({ ...d, date: addDays(startDate, i) }));

    try {
      await updateDoc(doc(db, 'trips', t.id), {
        title: $('dTitle').value.trim(),
        startDate,
        endDate,
        departureTime: $('dTime').value || '08:00',
        location: $('dLocation').value.trim(),
        days,
        updatedAt: serverTimestamp()
      });
      $('detailStatus').textContent = 'השינויים נשמרו';
    } catch (err) {
      $('detailStatus').textContent = 'השמירה נכשלה: ' + err.code;
    }
  });

  $('confirmBtn').addEventListener('click', async () => {
    const t = trips.find(x => x.id === currentTripId);
    if (!t || !currentUser || t.ownerUid !== currentUser.uid) return;
    const next = t.status === 'confirmed' ? 'draft' : 'confirmed';
    try {
      await updateDoc(doc(db, 'trips', t.id), { status: next, updatedAt: serverTimestamp() });
      $('detailStatus').textContent = next === 'confirmed' ? 'הטיול אושר' : 'האישור בוטל';
    } catch (err) {
      $('detailStatus').textContent = 'העדכון נכשל: ' + err.code;
    }
  });

  $('deleteBtn').addEventListener('click', async () => {
    const t = trips.find(x => x.id === currentTripId);
    if (!t || !currentUser || t.ownerUid !== currentUser.uid) return;
    if (!confirm('למחוק את "' + t.title + '" לצמיתות?')) return;
    try {
      await deleteDoc(doc(db, 'trips', t.id));
      currentTripId = null;
      showView('list');
    } catch (err) {
      $('detailStatus').textContent = 'המחיקה נכשלה: ' + err.code;
    }
  });
</script>
</body>
</html>
